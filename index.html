<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>منيو O’Bros</title>
<!-- أيقونة الغزالة فوق في التبويب -->
<link rel="icon" type="image/png" href="logo-bg.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0d0d0d;
  --card: rgba(15, 15, 15, 0.2);
  --ink: #e6e6e6;
  --mute: #a0a0a0;
  --line: rgba(255, 255, 255, 0.15);
  --head: rgba(10, 10, 10, 0.65);
  --accent: #e6e6e6;
  --accent-ink: #0d0d0d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Cairo", Tahoma, sans-serif;
  line-height: 1.5;
  position: relative;
  overflow-x: hidden;
}

/* --- خلفية الغزالة المائية واضحة وبارزة ورا الكاردات --- */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('logo-bg.png');
  background-repeat: no-repeat;
  background-position: center;
  background-size: min(90vw, 500px);
  opacity: 0.55;
  z-index: 0;
  pointer-events: none;
}

header, nav, main, footer { position: relative; z-index: 1; }

/* --- الهيدر واللوجو بخلفية زجاجية --- */
header {
  background: var(--head);
  padding: 22px 20px 18px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.brand-logo {
  max-height: 55px;
  width: auto;
  display: inline-block;
  filter: invert(1) brightness(1.2);
  margin-bottom: 2px;
}
header p {
  margin: 4px 0 12px;
  color: var(--mute);
  font-size: .9rem;
}

/* --- شريط البحث --- */
#q {
  width: min(420px, 100%);
  border: 1px solid var(--line);
  background: rgba(20, 20, 20, 0.3);
  color: var(--ink);
  font: inherit;
  padding: 9px 16px;
  border-radius: 99px;
  outline: none;
  text-align: center;
  backdrop-filter: blur(4px);
}
#q:focus { border-color: var(--accent); }

/* --- تابات الأقسام العلوية --- */
nav {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(13, 13, 13, 0.65);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  scrollbar-width: none;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--line);
  background: rgba(25, 25, 25, 0.25);
  color: var(--ink);
  font: inherit;
  font-size: .9rem;
  padding: 4px 15px;
  border-radius: 99px;
  cursor: pointer;
  line-height: 1.35;
  text-align: center;
  backdrop-filter: blur(4px);
}
nav button small {
  display: block;
  font-size: .68rem;
  color: var(--mute);
  direction: ltr;
}
nav button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
nav button[aria-pressed="true"] small { color: inherit; opacity: .75; }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- المحتوى الرئيسي والكاردات الشفافة الروقان --- */
main { max-width: 680px; margin: 0 auto; padding: 6px 14px 40px; }
section {
  scroll-margin-top: 68px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 6px 18px 8px;
  margin-top: 16px;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}
h2 {
  font-size: 1.2rem;
  margin: 12px 0 4px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
}
h2 span {
  font-size: .8rem;
  color: var(--mute);
  font-weight: 600;
  letter-spacing: .08em;
  direction: ltr;
}
.item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--line);
}
.item:last-child { border-bottom: 0; }
.txt { flex: 1; min-width: 0; }
.name { font-weight: 600; display: block; }
.en { display: block; color: var(--mute); font-size: .84rem; direction: ltr; text-align: right; }
.note { display: block; color: var(--mute); font-size: .78rem; margin-top: 2px; }
.note.l { direction: ltr; text-align: right; }
.price { font-weight: 800; white-space: nowrap; text-align: left; padding-top: 1px; }
.price small { font-weight: 400; color: var(--mute); margin-inline-start: 3px; font-size: .72rem; }
.opt { display: flex; justify-content: flex-end; gap: 8px; align-items: baseline; }
.opt em { font-style: normal; font-weight: 400; color: var(--mute); font-size: .76rem; }
.none { text-align: center; color: var(--mute); padding: 40px 0; display: none; }

/* --- الفوتر والتوقيع --- */
footer {
  text-align: center;
  color: var(--mute);
  font-size: .8rem;
  padding: 10px 20px 30px;
}
.protected-text {
  font-size: 0.75rem;
  color: var(--mute);
  letter-spacing: 1px;
  margin-top: 6px;
  font-weight: 600;
}
[hidden] { display: none !important; }
</style>
</head>
<body>

  <img src="logo-top.png" alt="O'Bros" class="brand-logo">
  <p>Menu | المنيو</p>
  <input id="q" type="search" placeholder="ابحث في المنيو · Search" aria-label="بحث">
</header>
<nav id="tabs" aria-label="أقسام المنيو"></nav>
<main id="menu"></main>
<p class="none" id="none">مفيش نتائج · No results</p>
<footer>
  O’Bros
  <div class="protected-text">Powered & Protected by Joy</div>

const menu = document.getElementById("menu"), tabs = document.getElementById("tabs");
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

const sections = CATS.map(([ar, en, items], i) => {
  const s = el("section"); s.id = "cat" + i;
  const h = el("h2", "", ar); h.appendChild(el("span", "", en.toUpperCase())); s.appendChild(h);
  items.forEach(([n, e, p, na, ne]) => {
    const row = el("div", "item"), txt = el("div", "txt");
    txt.append(el("span", "name", n), el("span", "en", e));
    if (na) txt.appendChild(el("span", "note", na));
    if (ne) txt.appendChild(el("span", "note l", ne));
    const price = el("div", "price");
    if (Array.isArray(p)) {
      p.forEach(([a, b, v]) => { const o = el("div", "opt"); o.append(el("em", "", a + " · " + b), el("span", "", v)); price.appendChild(o); });
    } else { price.append(el("span", "", p), el("small", "", CUR)); }
    row.dataset.t = [n, e, na, ne].join(" ").toLowerCase();
    row.append(txt, price); s.appendChild(row);
  });
  menu.appendChild(s);
  const b = el("button", "", ar); b.appendChild(el("small", "", en)); b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => s.scrollIntoView({ behavior: "smooth", block: "start" });
  tabs.appendChild(b);
  return s;

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) {
    const i = sections.indexOf(e.target);
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-pressed", i === j));
    tabs.children[i].scrollIntoView({ inline: "center", block: "nearest" });
  }
}), { rootMargin: "-20% 0px -70% 0px" });
sections.forEach(s => io.observe(s));

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let any = false;
  sections.forEach((s, i) => {
    let n = 0;
    s.querySelectorAll(".item").forEach(r => { const m = !q || r.dataset.t.includes(q); r.hidden = !m; if (m) n++; });
    s.hidden = n === 0; tabs.children[i].hidden = n === 0; if (n) any = true;
  });
  document.getElementById("none").style.display = any ? "none" : "block";
});
