<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>منيو O’Bros</title>
<!-- أيقونة الغزالة فوق في التبويب -->
<link rel="icon" type="image/png" href="logo-bg.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0b0b0b;
  --card: rgba(18, 18, 18, 0.35);
  --ink: #f0f0f0;
  --mute: #a8a8a8;
  --line: rgba(255, 255, 255, 0.12);
  --head: rgba(10, 10, 10, 0.75);
  --accent: #f0f0f0;
  --accent-ink: #0b0b0b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Cairo", Tahoma, sans-serif;
  line-height: 1.6;
  position: relative;
  overflow-x: hidden;
}

/* --- خلفية الغزالة المائية بوضوح وشياكة --- */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('logo-bg.png');
  background-repeat: no-repeat;
  background-position: center;
  background-size: min(85vw, 450px);
  opacity: 0.22;
  z-index: 0;
  pointer-events: none;
  filter: drop-shadow(0 0 30px rgba(255,255,255,0.05));
}

header, nav, main, footer { position: relative; z-index: 1; }

/* --- الهيدر واللوجو بخلفية زجاجية فاخرة --- */
header {
  background: var(--head);
  padding: 24px 20px 18px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.brand-logo {
  max-height: 60px;
  width: auto;
  display: inline-block;
  filter: invert(1) brightness(1.25);
  margin-bottom: 4px;
  transition: transform 0.3s ease;
}
.brand-logo:hover {
  transform: scale(1.03);
}
header p {
  margin: 4px 0 14px;
  color: var(--mute);
  font-size: .88rem;
  letter-spacing: 1px;
}

/* --- شريط البحث الروقان --- */
#q {
  width: min(440px, 100%);
  border: 1px solid var(--line);
  background: rgba(20, 20, 20, 0.45);
  color: var(--ink);
  font: inherit;
  padding: 10px 18px;
  border-radius: 99px;
  outline: none;
  text-align: center;
  backdrop-filter: blur(6px);
  transition: all 0.3s ease;
}
#q:focus {
  border-color: var(--accent);
  background: rgba(30, 30, 30, 0.6);
  box-shadow: 0 0 15px rgba(255,255,255,0.08);
}

/* --- تابات الأقسام العلوية --- */
nav {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(11, 11, 11, 0.75);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px;
  scrollbar-width: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--line);
  background: rgba(25, 25, 25, 0.3);
  color: var(--ink);
  font: inherit;
  font-size: .9rem;
  padding: 6px 16px;
  border-radius: 99px;
  cursor: pointer;
  line-height: 1.35;
  text-align: center;
  backdrop-filter: blur(4px);
  transition: all 0.25s ease;
}
nav button small {
  display: block;
  font-size: .68rem;
  color: var(--mute);
  direction: ltr;
  opacity: 0.8;
}
nav button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(255,255,255,0.15);
}
nav button[aria-pressed="true"] small { color: inherit; opacity: .85; }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- المحتوى الرئيسي والكاردات --- */
main { max-width: 680px; margin: 0 auto; padding: 10px 14px 45px; }
section {
  scroll-margin-top: 75px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 8px 20px 12px;
  margin-top: 20px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  transition: transform 0.3s ease;
}
h2 {
  font-size: 1.25rem;
  margin: 14px 0 8px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  letter-spacing: 0.5px;
}
h2 span {
  font-size: .8rem;
  color: var(--mute);
  font-weight: 600;
  letter-spacing: .1em;
  direction: ltr;
}
.item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px dashed var(--line);
}
.item:last-child { border-bottom: 0; }
.txt { flex: 1; min-width: 0; }
.name { font-weight: 600; display: block; font-size: 1.02rem; }
.en { display: block; color: var(--mute); font-size: .84rem; direction: ltr; text-align: right; }
.note { display: block; color: var(--mute); font-size: .78rem; margin-top: 3px; }
.note.l { direction: ltr; text-align: right; }
.price { font-weight: 800; white-space: nowrap; text-align: left; padding-top: 2px; font-size: 1.05rem; }
.price small { font-weight: 400; color: var(--mute); margin-inline-start: 4px; font-size: .75rem; }
.opt { display: flex; justify-content: flex-end; gap: 8px; align-items: baseline; margin-bottom: 2px; }
.opt em { font-style: normal; font-weight: 400; color: var(--mute); font-size: .76rem; }
.none { text-align: center; color: var(--mute); padding: 40px 0; display: none; font-size: 1.05rem; }

/* --- الفوتر والتوقيع الروقان --- */
footer {
  text-align: center;
  color: var(--mute);
  font-size: .85rem;
  padding: 20px 20px 40px;
  letter-spacing: 0.5px;
}
.protected-text {
  font-size: 0.75rem;
  color: var(--mute);
  letter-spacing: 1.5px;
  margin-top: 8px;
  font-weight: 600;
  opacity: 0.85;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <img src="logo-top.png" alt="O'Bros" class="brand-logo">
  <p>Menu | المنيو الرسمي</p>
  <input id="q" type="search" placeholder="ابحث في المنيو · Search..." aria-label="بحث">
</header>
<nav id="tabs" aria-label="أقسام المنيو"></nav>
<main id="menu"></main>
<p class="none" id="none">عذراً، مفيش نتائج مطابقة · No results found</p>
<footer>
  O’Bros Cafe
  <div class="protected-text">Powered by Joy · Protected by Joy</div>
</footer>

<script>
const CUR = "ج.م";
const CATS = [
 ["العصائر الفريش","Fresh Juices",[
  ["مانجو","Mango",90],
  ["كيوي","Kiwi",110],
  ["جوافة","Guava",90],
  ["فراولة","Strawberry",90],
  ["بطيخ","Watermelon",100],
  ["ليمون نعناع","Lemon Mint",80]
 ]],
 ["المشروبات الساخنة","Hot Drinks",[
  ["شاي","Tea",45,"(أحمر - أخضر)","(Black - Green)"],
  ["شاي فواكه","Fruit Tea",60],
  ["شاي بالحليب","Milk Tea",70],
  ["أعشاب","Herbal Tea",50,"(نعناع - ينسون - قرفة - زنجبيل - ليمون - بقدونس - كركديه)","(Mint - Anise - Cinnamon - Ginger - Lemon - Parsley - Hibiscus)"],
  ["كولد آند فلو","Cold & Flu",80,"(عصير برتقال - عسل أبيض - زنجبيل)","(Orange Juice - Honey - Ginger)"],
  ["أبل سايدر","Apple Cider",100,"(أعواد قرفة - قرنفل - عصير تفاح)","(Cinnamon Sticks - Cloves - Apple Juice)"],
  ["هوت شوكليت","Hot Chocolate",120],
  ["هوت أوريو","Hot Oreo",110],
  ["هوت لوتس","Hot Lotus",110],
  ["هوت بندق","Hot Hazelnut",110],
  ["سحلب","Sahlab",120]
 ]],
 ["السموزي","Smoothies",[
  ["مانجو","Mango",110],
  ["فراولة","Strawberry",110],
  ["باشون","Passion Fruit",110],
  ["كيوي","Kiwi",110],
  ["كريز","Cherry",110],
  ["بطيخ","Watermelon",110],
  ["خوخ","Peach",110],
  ["بينا كولادا","Piña Colada",135,"(لبن جوز الهند - أناناس)","(Coconut Milk - Pineapple)"],
  ["باشون خوخ","Passion Peach",135],
  ["ميكس بيري","Mixed Berry",135],
  ["مانجو باشون","Mango Passion",135],
  ["مانجو كيوي","Mango Kiwi",135]
 ]],
 ["موهيتو أوبرس","O'Bros Mojitos",[
  ["موهيتو كلاسيك","Classic Mojito",100,"سكر بني / شرائح ليمون / نعناع / صودا","Brown Sugar / Lemon Slices / Mint / Soda"],
  ["موهيتو بلو بيري","Blueberry Mojito",120,"سيرب موهيتو / بلو بيري / شرائح ليمون / نعناع / صودا","Mojito Syrup / Blueberry / Lemon Slices / Mint / Soda"],
  ["موهيتو راسبيري","Raspberry Mojito",120,"سيرب موهيتو / راسبيري / شرائح ليمون / نعناع / صودا","Mojito Syrup / Raspberry / Lemon Slices / Mint / Soda"],
  ["موهيتو ميكس بيري","Mixed Berry Mojito",145,"سيرب موهيتو / فراولة / بلو بيري / راسبيري / شرائح ليمون / نعناع / صودا","Mojito Syrup / Strawberry / Blueberry / Raspberry / Lemon Slices / Mint / Soda"],
  ["موهيتو باشون فروت","Passion Fruit Mojito",120,"سيرب موهيتو / باشون فروت / شرائح ليمون / نعناع / صودا","Mojito Syrup / Passion Fruit / Lemon Slices / Mint / Soda"],
  ["موهيتو خوخ","Peach Mojito",120,"سيرب موهيتو / خوخ / شرائح ليمون / نعناع / صودا","Mojito Syrup / Peach / Lemon Slices / Mint / Soda"],
  ["موهيتو باشون خوخ","Passion Peach Mojito",145,"سيرب موهيتو / باشون فروت / خوخ / شرائح ليمون / نعناع / صودا","Mojito Syrup / Passion Fruit / Peach / Lemon Slices / Mint / Soda"],
  ["موهيتو بطيخ","Watermelon Mojito",120,"سيرب موهيتو / بطيخ / شرائح ليمون / نعناع / صودا","Mojito Syrup / Watermelon / Lemon Slices / Mint / Soda"],
  ["موهيتو بطيخ نعناع","Watermelon Mint Mojito",120,"سيرب موهيتو / سيرب نعناع / بطيخ / شرائح ليمون / نعناع / صودا","Mojito Syrup / Mint Syrup / Watermelon / Lemon Slices / Mint / Soda"],
  ["موهيتو ريد بول","Red Bull Mojito",180,"سيرب موهيتو / شرائح ليمون / نعناع / ريد بول","Mojito Syrup / Lemon Slices / Mint / Red Bull"],
  ["بلو ريد بول","Blue Red Bull",200,"سيرب بلو كوراسون / شرائح ليمون / نعناع / ريد بول","Blue Curaçao Syrup / Lemon Slices / Mint / Red Bull"],
  ["ريد بول باشون خوخ","Passion Peach Red Bull",200,"سيرب موهيتو / باشون فروت / خوخ / شرائح ليمون / نعناع / ريد بول","Mojito Syrup / Passion Fruit / Peach / Lemon Slices / Mint / Red Bull"],
  ["ريد بول بلو وايت","Blue White Red Bull",200,"سيرب بلو بيري / جوز الهند / شرائح ليمون / نعناع / ريد بول","Blueberry Syrup / Coconut / Lemon Slices / Mint / Red Bull"],
  ["موهيتو بلو كوراسون","Blue Curaçao Mojito",120,"سيرب موهيتو / سيرب بلو كوراسون / شرائح ليمون / نعناع / صودا","Mojito Syrup / Blue Curaçao Syrup / Lemon Slices / Mint / Soda"],
  ["بلو ليمون","Blue Lemon",145,"سيرب بلو كوراسون / عصير ليمون / شرائح ليمون / نعناع / صودا","Blue Curaçao Syrup / Lemon Juice / Lemon Slices / Mint / Soda"],
  ["شيري كولا","Cherry Cola",145,"سيرب كريز / كولا","Cherry Syrup / Cola"],
  ["صن شاين","Sunshine",145,"جرينادين رمان / عصير برتقال / صودا","Pomegranate Grenadine / Orange Juice / Soda"],
  ["صن شاين بلو كوراسون","Blue Curaçao Sunshine",145,"جرينادين رمان / عصير برتقال / بلو كوراسون / صودا","Pomegranate Grenadine / Orange Juice / Blue Curaçao / Soda"],
  ["صن رايز","Sunrise",145,"جرينادين رمان / صودا","Pomegranate Grenadine / Soda"],
  ["بلو هاواي","Blue Hawaii",145,"سيرب بلو كوراسون / سيرب جوز الهند / عصير أناناس / عصير برتقال","Blue Curaçao Syrup / Coconut Syrup / Pineapple Juice / Orange Juice"],
  ["جامايكا","Jamaica",145,"جرينادين رمان / عصير برتقال / عصير ليمون / عصير أناناس / شرائح ليمون / نعناع","Pomegranate Grenadine / Orange Juice / Lemon Juice / Pineapple Juice / Lemon Slices / Mint"]
 ]],
 ["الكرواسون","Croissant",[
  ["كرواسون سادة","Plain Croissant",70],
  ["كرواسون تركي","Turkey Croissant",110],
  ["كرواسون تركي وشيدر","Turkey & Cheddar Croissant",130],
  ["ميكس تشيز","Mixed Cheese Croissant",130],
  ["كرواسون شوكولاتة","Chocolate Croissant",90],
  ["كرواسون بيستاشيو","Pistachio Croissant",100]
 ]]
];

const menu = document.getElementById("menu"), tabs = document.getElementById("tabs");
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

const sections = CATS.map(([ar, en, items], i) => {
  const s = el("section"); s.id = "cat" + i;
  const h = el("h2", "", ar); h.appendChild(el("span", "", en.toUpperCase())); s.appendChild(h);
  items.forEach(([n, e, p, na, ne]) => {
    const row = el("div", "item"), txt = el("div", "txt");
    txt.append(el("span", "name", n), el("span", "en", e));
    if (na) txt.appendChild(el("span", "note", na));
    if (ne) txt.appendChild(el("span", "note l", ne));
    const price = el("div", "price");
    if (Array.isArray(p)) {
      p.forEach(([a, b, v]) => { const o = el("div", "opt"); o.append(el("em", "", a + " · " + b), el("span", "", v)); price.appendChild(o); });
    } else { price.append(el("span", "", p), el("small", "", CUR)); }
    row.dataset.t = [n, e, na, ne].join(" ").toLowerCase();
    row.append(txt, price); s.appendChild(row);
  });
  menu.appendChild(s);
  const b = el("button", "", ar); b.appendChild(el("small", "", en)); b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => s.scrollIntoView({ behavior: "smooth", block: "start" });
  tabs.appendChild(b);
  return s;
});

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) {
    const i = sections.indexOf(e.target);
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-pressed", i === j));
    tabs.children[i].scrollIntoView({ inline: "center", block: "nearest" });
  }
}), { rootMargin: "-20% 0px -70% 0px" });
sections.forEach(s => io.observe(s));

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let any = false;
  sections.forEach((s, i) => {
    let n = 0;
    s.querySelectorAll(".item").forEach(r => { const m = !q || r.dataset.t.includes(q); r.hidden = !m; if (m) n++; });
    s.hidden = n === 0; tabs.children[i].hidden = n === 0; if (n) any = true;
  });
  document.getElementById("none").style.display = any ? "none" : "block";
});
</script>
</body>
</html>
