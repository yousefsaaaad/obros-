<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9d9d9">
<title>منيو O’Bros</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e6e6;--card:#f3f3f3;--ink:#1d1d1d;--mute:#6b6b6b;--line:#cdcdcd;--head:#d6d6d6;--accent:#2b2b2b;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#151515;--card:#1f1f1f;--ink:#ededed;--mute:#9b9b9b;--line:#343434;--head:#222;--accent:#ededed;--accent-ink:#151515}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,sans-serif;line-height:1.5}
header{background:var(--head);padding:28px 20px 20px;text-align:center}
.brand-title{font-family:'Permanent Marker', cursive, sans-serif;font-size:3rem;margin:0;color:var(--ink);letter-spacing:1px;line-height:1.1}
header p{margin:6px 0 14px;color:var(--mute);font-size:.95rem}
#q{width:min(420px,100%);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:9px 16px;border-radius:99px;outline:none;text-align:center}
#q:focus{border-color:var(--accent)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9rem;padding:4px 15px;border-radius:99px;cursor:pointer;line-height:1.35;text-align:center}
nav button small{display:block;font-size:.68rem;color:var(--mute);direction:ltr}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
nav button[aria-pressed="true"] small{color:inherit;opacity:.75}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:6px 14px 40px}
section{scroll-margin-top:68px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px 8px;margin-top:16px}
h2{font-size:1.2rem;margin:12px 0 4px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--accent)}
h2 span{font-size:.8rem;color:var(--mute);font-weight:600;letter-spacing:.08em;direction:ltr}
.item{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.txt{flex:1;min-width:0}
.name{font-weight:600;display:block}
.en{display:block;color:var(--mute);font-size:.84rem;direction:ltr;text-align:right}
.note{display:block;color:var(--mute);font-size:.78rem;margin-top:2px}
.note.l{direction:ltr;text-align:right}
.price{font-weight:800;white-space:nowrap;text-align:left;padding-top:1px}
.price small{font-weight:400;color:var(--mute);margin-inline-start:3px;font-size:.72rem}
.opt{display:flex;justify-content:flex-end;gap:8px;align-items:baseline}
.opt em{font-style:normal;font-weight:400;color:var(--mute);font-size:.76rem}
.none{text-align:center;color:var(--mute);padding:40px 0;display:none}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:10px 20px 30px}
.protected-text{font-size:0.75rem;color:var(--mute);letter-spacing:1px;margin-top:6px;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1 class="brand-title">O’Bros</h1>
  <p>Menu | المنيو</p>
  <input id="q" type="search" placeholder="ابحث في المنيو · Search" aria-label="بحث">
</header>
<nav id="tabs" aria-label="أقسام المنيو"></nav>
<main id="menu"></main>
<p class="none" id="none">مفيش نتائج · No results</p>
<footer>
  O’Bros
  <div class="protected-text">Protected by Joy</div>
</footer>

<script>

const S = (a, b) => [["سنجل","Single",a],["دبل","Double",b]];

 ["القهوة المثلجة","Ice Coffee",[
  ["آيس لاتيه","Iced Latte",110],
  ["آيس كابتشينو","Iced Cappuccino",140],
  ["آيس كاراميل ميكاتو","Iced Caramel Macchiato",140],

  ["آيس ماتشا","Iced Matcha",110],

  ["فرابيه كلاسيك","Classic Frappe",125],

  ["فرابيه لوتس","Lotus Frappe",140],

 ["المشروبات الغازية","Soft Drinks",[

  ["مياه","Water",15],

 ]],
 ["الكرواسون","Croissant",[

 ["الكوكيز","Cookies",[

 ["الكيك","Cakes",[

 ["الساندوتشات","Sandwiches",[

 ["السلطات","Salads",[

 ["الإضافات","Extras",[

 ]]
];

const menu = document.getElementById("menu"), tabs = document.getElementById("tabs");
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

const sections = CATS.map(([ar, en, items], i) => {
  const s = el("section"); s.id = "cat" + i;
  const h = el("h2", "", ar); h.appendChild(el("span", "", en.toUpperCase())); s.appendChild(h);
  items.forEach(([n, e, p, na, ne]) => {
    const row = el("div", "item"), txt = el("div", "txt");
    txt.append(el("span", "name", n), el("span", "en", e));
    if (na) txt.appendChild(el("span", "note", na));
    if (ne) txt.appendChild(el("span", "note l", ne));
    const price = el("div", "price");
    if (Array.isArray(p)) {
      p.forEach(([a, b, v]) => { const o = el("div", "opt"); o.append(el("em", "", a + " · " + b), el("span", "", v)); price.appendChild(o); });
    } else { price.append(el("span", "", p), el("small", "", CUR)); }
    row.dataset.t = [n, e, na, ne].join(" ").toLowerCase();
    row.append(txt, price); s.appendChild(row);
  });
  menu.appendChild(s);
  const b = el("button", "", ar); b.appendChild(el("small", "", en)); b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => s.scrollIntoView({ behavior: "smooth", block: "start" });
  tabs.appendChild(b);
  return s;
});

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) {
    const i = sections.indexOf(e.target);
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-pressed", i === j));
    tabs.children[i].scrollIntoView({ inline: "center", block: "nearest" });
  }
}), { rootMargin: "-20% 0px -70% 0px" });
sections.forEach(s => io.observe(s));

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let any = false;
  sections.forEach((s, i) => {
    let n = 0;
    s.querySelectorAll(".item").forEach(r => { const m = !q || r.dataset.t.includes(q); r.hidden = !m; if (m) n++; });
    s.hidden = n === 0; tabs.children[i].hidden = n === 0; if (n) any = true;
  });
  document.getElementById("none").style.display = any ? "none" : "block";
});
</script>
</body>
</html>
